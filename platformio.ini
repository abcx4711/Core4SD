; Core4SD SD-Browser firmware -- Arduino Nano (ATmega328P or ATmega328PB, 16 MHz)
;
;   pio run                        build both (bin/core4sd_328p.hex, bin/core4sd_328pb.hex)
;   pio run -e nano328p  -t upload flash a Nano with an ATmega328P
;   pio run -e nano328pb -t upload flash a Nano with an ATmega328PB
;                                  (disconnect +5V from the Apple first!)

[platformio]

default_envs = nano328p, nano328pb

[common]
pport = COM6    ; port for 328p
pbport = COM6   ; port for 328pb

[env]
platform = atmelavr
framework = arduino

; pre:  assembles apple/*.asm, regenerates src/bootimg.h and apple/CORE4SD.PO
; post: copies firmware.hex, CORE4SD.SYSTEM and CORE4SD.PO to bin/
extra_scripts =
    pre:pre_build.py
    post:post_build.py

monitor_speed = 230400

upload_protocol = urclock
board_build.core = minicore
board_build.f_cpu = 16000000L   ; 16 MHz crystal (for 8 MHz change to 8000000L)

;upload_speed = 57600            ; some Nano boards have problems with one or the other setting, check it out
upload_speed = 115200

lib_deps =
    greiman/SdFat @ ~2.3.1
build_flags = -Wall -Wextra -Werror -DSERIAL_RX_BUFFER_SIZE=1

[env:nano328p]
; Nano with an ATmega328P and the new bootloader; use "nanoatmega328" for the old one
board = ATmega328P
board_build.variant = standard    ; <- Standard Pinout for 328P

upload_port = ${common.pport}
monitor_port = ${common.pport}

[env:nano328pb]
; Nano with an ATmega328PB (e.g. some newer clones: the chip says "328PB")
board = ATmega328PB

upload_port = ${common.pbport}
monitor_port = ${common.pbport}
